spring.application.name=user-service

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_user_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:jamersc28}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Add comma-separated origins with local dev as a default fallback
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Hikari Connection Pool Tuning Parameters
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Security Profiles
security.jwt.secret.key=${JWT_SECRET_KEY:e84e1e3cc2e72e7b050899dcbd2f78be653f6b26f718a6ce6860c1d6fb42385e}
security.jwt.expiration.time=${JWT_EXP_TIME:86400000}
