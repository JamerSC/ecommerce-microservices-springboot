#hashids.min-length=${HASHIDS_LENGTH:10}
#hashids.alphabet=${HASHIDS_ALPHABET:abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890}

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
#url http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
#url http://localhost:8080/api-docs or api-docs/yaml

